<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px}
/* ========== 主题变量：浅色 / 深色两套配色 ========== */
:root{
--bg:#E8F4F8;--bg-alt:#D6EAF8;--bg-card:rgba(255,255,255,.7);
--text:#111111;--text-sec:#333333;--text-muted:#555555;
--primary:#5DADE2;--primary-d:#2E86C1;--primary-l:#85C1E9;--primary-50:rgba(93,173,226,.12);
--accent:#E91E63;--accent-d:#C2185B;--accent-l:#F06292;--accent-50:rgba(233,30,99,.1);
--border:rgba(93,173,226,.2);
--shadow:0 1px 3px rgba(0,0,0,.06),0 6px 20px rgba(93,173,226,.15);
--shadow-lg:0 4px 6px rgba(0,0,0,.05),0 16px 32px rgba(93,173,226,.18);
--shadow-hover:0 2px 6px rgba(0,0,0,.08),0 12px 28px rgba(93,173,226,.25);
--radius:16px;--radius-sm:10px;--radius-xs:6px;
--grad:linear-gradient(135deg,#5DADE2 0%,#85C1E9 45%,#E91E63 100%);
--maxw:1080px;
--font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Helvetica,Arial,sans-serif;
}
[data-theme="dark"]{
--bg:#1a1a1a;--bg-alt:#252525;--bg-card:#2d2d2d;
--text:#f5f5f5;--text-sec:#b8b8b8;--text-muted:#888888;
--primary:#fbbf24;--primary-d:#f59e0b;--primary-l:#fde68a;--primary-50:#3d2e0a;
--accent:#f472b6;--accent-d:#ec4899;--accent-l:#f9a8d4;--accent-50:#3d1a2e;
--border:#3d3d3d;
--shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(251,191,36,.12);
--shadow-lg:0 4px 6px rgba(0,0,0,.35),0 20px 40px rgba(251,191,36,.15);
--shadow-hover:0 2px 8px rgba(0,0,0,.4),0 12px 32px rgba(251,191,36,.2);
--grad:linear-gradient(135deg,#fbbf24 0%,#fde68a 45%,#f472b6 100%);
}
[data-theme="dark"] .navbar{background:rgba(26,26,26,.85);border-bottom:1px solid rgba(251,191,36,.15)}
[data-theme="dark"] .nav-link{color:rgba(245,245,245,.9)}
[data-theme="dark"] .nav-link:hover{color:#fbbf24;background:rgba(251,191,36,.08)}
[data-theme="dark"] .nav-link.active{color:#fbbf24;background:rgba(251,191,36,.1)}
[data-theme="dark"] .nav-btn{border:1px solid rgba(251,191,36,.2);background:rgba(45,45,45,.8);color:#f5f5f5}
[data-theme="dark"] .nav-btn:hover{background:rgba(251,191,36,.12);color:#fbbf24;border-color:rgba(251,191,36,.4)}
[data-theme="dark"] .nav-hamburger{border:1px solid rgba(251,191,36,.2);background:rgba(45,45,45,.8);color:#f5f5f5}
[data-theme="dark"] .nav-hamburger:hover{background:rgba(251,191,36,.12);color:#fbbf24;border-color:rgba(251,191,36,.4)}
[data-theme="dark"] .mobile-nav{background:rgba(26,26,26,.95);border-bottom:1px solid rgba(251,191,36,.15)}
[data-theme="dark"] .mobile-nav .nav-link{color:rgba(245,245,245,.9)}
[data-theme="dark"] .mobile-nav .nav-link:hover,[data-theme="dark"] .mobile-nav .nav-link.active{color:#fbbf24;background:rgba(251,191,36,.1)}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.7;overflow-x:hidden;transition:background .3s ease,color .3s ease}
::selection{background:var(--primary);color:#fff}
::-webkit-scrollbar{width:7px}
::-webkit-scrollbar-track{background:var(--bg-alt)}
::-webkit-scrollbar-thumb{background:var(--primary-l);border-radius:4px}
[data-theme="dark"] ::-webkit-scrollbar-thumb{background:#f59e0b}
a{color:inherit;text-decoration:none}

/* ===== 顶部阅读进度条 ===== */
.scroll-progress{position:fixed;top:0;left:0;height:3px;width:0;background:var(--grad);z-index:9999;transition:width .15s ease;border-radius:0 3px 3px 0}

/* ===== 顶部导航栏 ===== */
.navbar{position:fixed;top:0;left:0;width:100%;height:64px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:rgba(255,255,255,.75);border-bottom:1px solid rgba(0,0,0,.05);z-index:1000;display:flex;align-items:center;transition:background .3s ease}
.nav-inner{max-width:var(--maxw);width:100%;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:16px}
.nav-logo{font-weight:800;font-size:1.15rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap;cursor:pointer}
[data-theme="dark"] .nav-logo{background:linear-gradient(90deg,#fbbf24,#f472b6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.nav-links{display:flex;gap:2px;margin-left:auto;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-link{padding:6px 12px;font-size:.85rem;color:#4b5563;border-radius:var(--radius-xs);white-space:nowrap;transition:all .2s ease;cursor:pointer;font-weight:500}
.nav-link:hover{color:var(--primary);background:var(--primary-50)}
.nav-link.active{color:var(--primary);font-weight:600;background:var(--primary-50)}
.nav-controls{display:flex;gap:6px;align-items:center}
.nav-btn{height:36px;min-width:36px;border:1px solid var(--border);border-radius:var(--radius-xs);background:var(--bg-card);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;color:var(--text);transition:all .2s ease;flex-shrink:0;padding:0 6px}
.nav-btn:hover{background:var(--primary-50);border-color:var(--primary-l);color:var(--primary);transform:translateY(-1px)}
.lang-btn{width:auto;padding:0 10px;font-size:.8rem;font-weight:600}
.nav-hamburger{display:none;height:36px;width:36px;border:1px solid var(--border);border-radius:var(--radius-xs);background:var(--bg-card);cursor:pointer;align-items:center;justify-content:center;font-size:1.2rem;color:var(--text);transition:all .2s ease;flex-shrink:0;padding:0}
.nav-hamburger:hover{background:var(--primary-50);border-color:var(--primary-l);color:var(--primary)}
.mobile-nav{display:none;position:fixed;top:64px;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,.05);z-index:999;padding:12px 20px 20px;flex-direction:column;gap:4px;animation:mobileNavIn .25s ease}
.mobile-nav.open{display:flex}
.mobile-nav .nav-link{padding:12px 16px;font-size:.95rem;border-radius:var(--radius-xs);color:#4b5563}
.mobile-nav .nav-link:hover,.mobile-nav .nav-link.active{color:var(--primary);background:var(--primary-50)}
@keyframes mobileNavIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes photoSway{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-9px) rotate(-1.6deg)}}

/* ===== 首页 Hero 区（3D 名片 + 简介 + 联系方式） ===== */
.hero{min-height:100vh;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px 20px 60px;background:linear-gradient(180deg,#D6EAF8 0%,#E8F4F8 40%,#f0f8fc 80%,var(--bg) 100%);color:var(--text);overflow:hidden;perspective:1200px}
[data-theme="dark"] .hero{background:linear-gradient(180deg,#1a1a1a 0%,#252525 60%,var(--bg) 100%);color:#fff}
.hero::after{display:none}
.hero-bg{position:absolute;inset:0;z-index:0;overflow:hidden}
.bg-blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.18;animation:blobFloat 10s ease-in-out infinite}
.bg-blob-1{width:380px;height:380px;background:#5DADE2;top:-60px;left:-40px}
.bg-blob-2{width:320px;height:320px;background:#E91E63;bottom:-40px;right:-30px;animation-delay:-4s}
.bg-blob-3{width:240px;height:240px;background:#85C1E9;top:38%;left:58%;animation-delay:-7s}
[data-theme="dark"] .bg-blob{opacity:.22}
[data-theme="dark"] .bg-blob-1{background:#fbbf24}
[data-theme="dark"] .bg-blob-2{background:#f9a8d4}
[data-theme="dark"] .bg-blob-3{background:#fde68a}
@keyframes blobFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(24px,-30px) scale(1.06)}66%{transform:translate(-18px,22px) scale(.96)}}
.sparkle{position:absolute;width:4px;height:4px;border-radius:50%;background:rgba(93,173,226,.6);animation:twinkle 3s ease-in-out infinite}
[data-theme="dark"] .sparkle{background:rgba(251,191,36,.6)}
@keyframes twinkle{0%,100%{opacity:.1;transform:scale(1)}50%{opacity:.7;transform:scale(1.9)}}
.hero-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:22px;max-width:680px;text-align:center}

.card-stage{perspective:1200px;display:flex;justify-content:center;padding:30px 0 10px}
.card-wrapper{display:flex;flex-direction:column;align-items:center;transform-style:preserve-3d;transition:transform .15s ease-out;will-change:transform;--holo-angle:135deg}
.card-lanyard{width:36px;height:22px;background:rgba(93,173,226,.12);border:1.5px solid rgba(93,173,226,.3);border-bottom:none;border-radius:18px 18px 0 0;position:relative;z-index:1}
.card-lanyard::before{content:'';position:absolute;top:5px;left:50%;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:var(--bg-alt);border:1.5px solid rgba(93,173,226,.4);box-shadow:inset 0 0 4px rgba(93,173,226,.15)}
[data-theme="dark"] .card-lanyard{background:rgba(255,255,255,.1);border-color:rgba(251,191,36,.22)}
[data-theme="dark"] .card-lanyard::before{background:#1a1a1a;border-color:rgba(251,191,36,.3)}
/* ===== 3D 玻璃名片卡（全息 / 高光 / 扫光多层叠加） ===== */
.glass-card{width:300px;height:392px;border-radius:18px;background:rgba(255,255,255,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:2px solid rgba(93,173,226,.25);position:relative;box-shadow:0 20px 50px rgba(93,173,226,.15),inset 0 1px 0 rgba(255,255,255,.9);overflow:hidden;will-change:transform;--mx:50%;--my:50%}
[data-theme="dark"] .glass-card{background:rgba(45,45,45,.6);border-color:rgba(251,191,36,.25);box-shadow:0 20px 50px rgba(0,0,0,.4),inset 0 1px 0 rgba(251,191,36,.15)}
.glass-card::before{content:'';position:absolute;inset:0;border-radius:18px;background:radial-gradient(circle at var(--mx) var(--my),rgba(93,173,226,.2) 0%,transparent 55%);pointer-events:none;z-index:6}
[data-theme="dark"] .glass-card::before{background:radial-gradient(circle at var(--mx) var(--my),rgba(251,191,36,.15) 0%,transparent 55%)}
.glass-card::after{content:'';position:absolute;inset:0;border-radius:18px;padding:2px;background:linear-gradient(135deg,rgba(93,173,226,.35),rgba(255,255,255,.1) 40%,rgba(233,30,99,.2));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:7}
[data-theme="dark"] .glass-card::after{background:linear-gradient(135deg,rgba(251,191,36,.4),rgba(255,255,255,.05) 40%,rgba(244,114,182,.3))}
.card-body{position:absolute;inset:10px;border-radius:12px;background:rgba(255,255,255,.35);border:1px solid rgba(93,173,226,.15);overflow:hidden;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:translateZ(15px);transition:transform .15s ease-out}
[data-theme="dark"] .card-body{background:rgba(26,26,26,.4);border-color:rgba(251,191,36,.1)}
.card-photo{width:100%;height:100%;object-fit:cover;display:block;border-radius:12px}
.card-holo{position:absolute;inset:0;border-radius:18px;background:conic-gradient(from var(--holo-angle) at 50% 50%,rgba(93,173,226,.18),rgba(233,30,99,.12),rgba(133,193,233,.15),rgba(255,215,0,.1),rgba(233,30,99,.12),rgba(93,173,226,.18));mix-blend-mode:screen;opacity:.5;filter:blur(28px) saturate(1.5);z-index:4;pointer-events:none;animation:holoShift 8s ease-in-out infinite}
[data-theme="dark"] .card-holo{background:conic-gradient(from var(--holo-angle) at 50% 50%,rgba(251,191,36,.18),rgba(244,114,182,.14),rgba(253,230,138,.12),rgba(251,191,36,.12));opacity:.55}
@keyframes holoShift{0%,100%{opacity:.35;filter:blur(28px) saturate(1.4)}50%{opacity:.55;filter:blur(20px) saturate(1.6)}}
.card-spec{position:absolute;inset:0;border-radius:18px;background:radial-gradient(ellipse 55% 45% at var(--mx) var(--my),rgba(255,255,255,.3) 0%,transparent 70%);z-index:5;pointer-events:none}
[data-theme="dark"] .card-spec{background:radial-gradient(ellipse 55% 45% at var(--mx) var(--my),rgba(251,191,36,.2) 0%,transparent 70%)}
.card-shine{position:absolute;top:0;left:-80%;width:70%;height:100%;background:linear-gradient(105deg,transparent,rgba(93,173,226,.12),transparent);transform:skewX(-18deg);animation:shine 5s ease-in-out infinite;z-index:6;pointer-events:none}
[data-theme="dark"] .card-shine{background:linear-gradient(105deg,transparent,rgba(251,191,36,.12),transparent)}
@keyframes shine{0%,60%,100%{left:-80%}30%{left:140%}}
.card-badge{position:absolute;bottom:16px;left:50%;transform:translateX(-50%) translateZ(25px);z-index:8;background:rgba(93,173,226,.85);backdrop-filter:blur(10px);color:#fff;font-size:.72rem;padding:5px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.4);white-space:nowrap;transition:transform .15s ease-out}
[data-theme="dark"] .card-badge{background:rgba(45,45,45,.8);border-color:rgba(251,191,36,.3)}
@media(min-width:600px){.glass-card{width:340px;height:440px}}

.hero-hello{font-size:1rem;color:var(--text-sec);font-weight:500}
[data-theme="dark"] .hero-hello{color:rgba(245,245,245,.8)}
.hero-name{font-size:2.6rem;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1.25}
[data-theme="dark"] .hero-name{background:linear-gradient(120deg,#fbbf24,#f472b6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero-badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.hero-badge{font-size:.78rem;padding:4px 12px;border-radius:20px;background:var(--primary-50);border:1px solid rgba(93,173,226,.3);color:var(--primary-d);font-weight:600;transition:all .25s ease;cursor:default}
.hero-badge:hover{transform:translateY(-3px);border-color:var(--primary);background:rgba(93,173,226,.18)}
[data-theme="dark"] .hero-badge{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.2);color:rgba(245,245,245,.9)}
[data-theme="dark"] .hero-badge:hover{border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.15)}
.hero-desc{font-size:.95rem;color:var(--text-sec);max-width:540px;line-height:1.8}
[data-theme="dark"] .hero-desc{color:rgba(245,245,245,.8)}
.hero-contact{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.contact-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:var(--radius-sm);font-size:.85rem;font-weight:600;cursor:pointer;transition:all .25s ease;border:1px solid var(--border);background:var(--bg-card);color:var(--text);backdrop-filter:blur(8px)}
.contact-btn:hover{transform:translateY(-2px);background:var(--primary-50);border-color:var(--primary-l);color:var(--primary-d);box-shadow:0 6px 20px rgba(93,173,226,.25)}
.contact-btn.primary{background:var(--grad);color:#fff;border:none}
.contact-btn.primary:hover{box-shadow:0 6px 24px rgba(93,173,226,.5)}
.contact-btn .ico{font-size:1rem}
.hero-hint{font-size:.78rem;color:var(--text-muted);margin-top:2px;display:flex;align-items:center;gap:6px}
[data-theme="dark"] .hero-hint{color:rgba(245,245,245,.6)}
.hero-scroll{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--text-muted);font-size:.78rem;animation:bounce 2s ease-in-out infinite;z-index:6}
[data-theme="dark"] .hero-scroll{color:rgba(245,245,245,.6)}
@keyframes bounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(8px)}}

/* ===== 主体内容区 ===== */
main{max-width:var(--maxw);margin:0 auto;padding:0 20px}
section{padding:80px 0 40px;position:relative}
.section-head{display:flex;align-items:center;gap:14px;margin-bottom:36px}
.section-num{font-size:.8rem;font-weight:800;color:var(--primary);background:var(--primary-50);padding:3px 10px;border-radius:20px;letter-spacing:.5px}
.section-title{font-size:1.6rem;font-weight:800;color:var(--text)}
.section-line{flex:1;height:2px;background:linear-gradient(90deg,var(--primary-l),transparent);border-radius:2px;margin-left:8px}
.section-emoji{font-size:1.4rem}
.section-hint{font-size:.78rem;color:var(--text-muted);margin:-24px 0 24px;font-weight:500}

/* ===== 亮点成果（数据卡片） ===== */
.highlight-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.highlight-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:28px 20px;text-align:center;box-shadow:var(--shadow);transition:all .3s cubic-bezier(.16,1,.3,1);position:relative;overflow:hidden}
.highlight-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad)}
.highlight-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-hover);border-color:var(--primary-l)}
.highlight-num{font-size:2.4rem;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1}
.highlight-suffix{font-size:1.2rem;font-weight:800;color:var(--primary)}
.highlight-label{font-size:.85rem;color:var(--text-sec);margin-top:8px;font-weight:500}
.highlight-ico{font-size:1.8rem;margin-bottom:8px}

/* ===== 标签页（经历 / 项目共用） ===== */
.tab-wrap{margin-top:8px}
.tab-list{display:flex;gap:6px;background:var(--bg-alt);padding:5px;border-radius:var(--radius-sm);margin-bottom:24px;overflow-x:auto;scrollbar-width:none}
.tab-list::-webkit-scrollbar{display:none}
.tab-btn{flex:1;min-width:120px;padding:10px 16px;border:none;background:transparent;border-radius:var(--radius-xs);font-size:.88rem;font-weight:600;color:var(--text-sec);cursor:pointer;transition:all .25s ease;white-space:nowrap;text-align:center;font-family:var(--font)}
.tab-btn:hover{color:var(--primary)}
.tab-btn.active{background:var(--bg-card);color:var(--primary);box-shadow:var(--shadow)}
.tab-btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.tab-panel{display:none;animation:tabFade .35s ease}
.tab-panel.active{display:block}
@keyframes tabFade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ===== 时间线（经历） ===== */
.timeline{position:relative;padding-left:28px}
.timeline::before{content:'';position:absolute;left:7px;top:8px;bottom:0;width:2px;background:linear-gradient(180deg,var(--primary-l),var(--accent-l),transparent)}
.timeline-item{position:relative;margin-bottom:28px}
.timeline-item:last-child{margin-bottom:0}
.timeline-dot{position:absolute;left:-28px;top:4px;width:16px;height:16px;border-radius:50%;background:var(--bg-card);border:3px solid var(--primary);box-shadow:0 0 0 4px var(--primary-50);transition:all .3s ease}
.timeline-item:hover .timeline-dot{background:var(--primary);transform:scale(1.15)}
.timeline-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;box-shadow:var(--shadow);transition:all .3s ease}
.timeline-card:hover{box-shadow:var(--shadow-hover);border-color:var(--primary-l);transform:translateX(4px)}
.timeline-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.timeline-title{font-weight:700;font-size:1.05rem;color:var(--text)}
.timeline-org{color:var(--primary);font-size:.85rem;font-weight:600}
.timeline-date{font-size:.78rem;color:var(--text-muted);background:var(--bg-alt);padding:3px 10px;border-radius:20px;white-space:nowrap}
.timeline-list{list-style:none;padding:0;margin:0}
.timeline-list li{font-size:.88rem;color:var(--text-sec);padding:4px 0 4px 18px;position:relative;line-height:1.7}
.timeline-list li::before{content:'';position:absolute;left:0;top:13px;width:5px;height:5px;border-radius:50%;background:var(--accent-l)}

/* ===== 项目卡片 ===== */
.project-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.project-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:all .35s cubic-bezier(.16,1,.3,1);position:relative}
.project-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-hover);border-color:var(--primary-l)}
.project-banner{height:90px;background:var(--grad);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.project-banner::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 70% 30%,rgba(255,255,255,.2),transparent)}
.project-emoji{font-size:2.5rem;z-index:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.15))}
.project-body{padding:20px}
.project-name{font-weight:700;font-size:1.05rem;color:var(--text);margin-bottom:4px}
.project-date{font-size:.75rem;color:var(--text-muted);margin-bottom:12px}
.project-stack{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.stack-tag{font-size:.72rem;padding:2px 9px;border-radius:12px;background:var(--primary-50);color:var(--primary);font-weight:600}
.project-desc{list-style:none;padding:0;margin:0 0 14px}
.project-desc li{font-size:.82rem;color:var(--text-sec);padding:3px 0 3px 16px;position:relative;line-height:1.65}
.project-desc li::before{content:'▸';position:absolute;left:0;color:var(--primary-l);font-size:.7rem;top:5px}
.project-link{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:600;color:var(--primary);padding:7px 14px;border-radius:var(--radius-xs);background:var(--primary-50);transition:all .25s ease}
.project-link:hover{background:var(--primary);color:#fff;transform:translateX(3px)}

/* ===== 技能清单 ===== */
.skill-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.skill-cat{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);transition:all .3s ease}
.skill-cat:hover{box-shadow:var(--shadow-hover);border-color:var(--primary-l);transform:translateY(-3px)}
.skill-cat-head{display:flex;align-items:center;gap:8px;margin-bottom:18px}
.skill-cat-ico{font-size:1.3rem}
.skill-cat-name{font-weight:700;font-size:1rem;color:var(--text)}
.skill-item{margin-bottom:12px}
.skill-item:last-child{margin-bottom:0}
.skill-name{font-size:.82rem;color:var(--text);font-weight:600;margin-bottom:3px}
.skill-level{font-size:.75rem;color:var(--text-muted);font-weight:500;margin-left:6px}
.skill-desc{font-size:.78rem;color:var(--text-sec);line-height:1.5}

/* ===== 教育 & 证书 ===== */
.edu-row{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:16px}
.edu-row:last-child{margin-bottom:0}
.edu-card{flex:1 1 300px;display:flex;align-items:flex-start;gap:14px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);transition:all .3s ease;position:relative;overflow:hidden}
.edu-card:hover{box-shadow:var(--shadow-hover);border-color:var(--primary-l);transform:translateY(-3px)}
.edu-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--grad)}
.edu-ico{font-size:1.6rem;flex-shrink:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--primary-50);border:1px solid var(--border)}
.edu-body{flex:1;min-width:0}
.edu-school{font-weight:700;font-size:1rem;color:var(--text);margin-bottom:3px}
.edu-major{font-size:.82rem;color:var(--primary);font-weight:600;margin-bottom:3px}
.edu-date{font-size:.75rem;color:var(--text-muted);margin-bottom:8px}
.edu-note{font-size:.8rem;color:var(--text-sec);line-height:1.6}
.cert-badge{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:12px;background:var(--accent-50);color:var(--accent);font-weight:600;margin-top:8px}

/* ===== 页脚 ===== */
.footer{text-align:center;padding:30px 20px;border-top:1px solid var(--border);background:var(--bg-alt)}
.footer-heart{font-size:.85rem;color:var(--text-sec);margin-bottom:6px}
.footer-heart span{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:700}
.footer-update{font-size:.75rem;color:var(--text-muted)}
.footer-thanks{margin:16px 0 12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.footer-emoji{font-size:2.2rem;animation:emojiBounce 2s ease-in-out infinite}
@keyframes emojiBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.footer-thanks-text{font-size:.9rem;color:var(--text-sec);font-weight:600}
.footer-contact{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.footer-contact-item{font-size:.78rem;padding:5px 12px;border-radius:20px;background:var(--primary-50);border:1px solid var(--border);color:var(--text-sec);cursor:pointer;transition:all .2s ease;display:inline-flex;align-items:center;gap:5px}
.footer-contact-item:hover{border-color:var(--primary-l);color:var(--primary);transform:translateY(-2px)}

/* ===== 返回顶部按钮 ===== */
.back-top{position:fixed;bottom:24px;right:24px;width:44px;height:44px;border-radius:50%;border:none;background:var(--grad);color:#fff;font-size:1.2rem;cursor:pointer;box-shadow:var(--shadow-lg);z-index:900;opacity:0;pointer-events:none;transform:translateY(20px) scale(.8);transition:all .3s cubic-bezier(.16,1,.3,1);display:flex;align-items:center;justify-content:center}
.back-top.show{opacity:1;pointer-events:auto;transform:translateY(0) scale(1)}
.back-top:hover{transform:translateY(-4px) scale(1.05);box-shadow:0 8px 32px rgba(99,102,241,.4)}

/* ===== 轻提示气泡 ===== */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--bg-card);border:1px solid var(--border);padding:10px 22px;border-radius:30px;font-size:.85rem;font-weight:600;color:var(--text);box-shadow:var(--shadow-lg);z-index:2000;opacity:0;transition:all .35s cubic-bezier(.16,1,.3,1);display:flex;align-items:center;gap:8px;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== 进站彩带 ===== */
.confetti{position:fixed;width:8px;height:8px;top:-10px;z-index:9998;pointer-events:none;border-radius:2px;animation:confettiFall 3s linear forwards}
@keyframes confettiFall{to{transform:translateY(105vh) rotate(720deg);opacity:0}}

[data-reveal]{opacity:0;transform:translateY(40px) scale(.94);transition:opacity .6s cubic-bezier(.16,1,.3,1),transform .6s cubic-bezier(.16,1,.3,1)}
[data-reveal="left"]{transform:translateX(-40px) scale(.94)}
[data-reveal="right"]{transform:translateX(40px) scale(.94)}
[data-reveal="scale"]{transform:scale(.88)}
[data-reveal].in-view{opacity:1;transform:translate(0,0) scale(1) !important}
.page-enter{animation:pageEnter .6s ease}
@keyframes pageEnter{from{opacity:0}to{opacity:1}}

/* ===== 打印样式（导出 PDF 简历用） ===== */
@media print{
@page{margin:1.5cm}
.navbar,.back-top,.hero-scroll,.hero-hint,.scroll-progress,.contact-btn,.hero-contact,.nav-btn,.confetti,.hero-bg,.card-shine,.card-holo,.card-spec,.mobile-nav{display:none !important}
body{background:#fff;color:#000;font-size:11pt}
.hero{min-height:auto;padding:20px 0;background:#fff;color:#000}
.hero::after{display:none}
.hero-name,.hero-hello,.hero-desc{color:#000;-webkit-text-fill-color:#000}
.hero-badges,.card-stage{display:none}
section{padding:20px 0;page-break-inside:avoid}
.tab-panel{display:block !important}
.tab-list{display:none}
.highlight-card,.timeline-card,.project-card,.skill-cat,.edu-card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
[data-reveal]{opacity:1 !important;transform:none !important}
.footer{border-top:1px solid #ccc;background:none}
.project-link::after{content:" (" attr(href) ")";font-size:.7rem;color:#666}
}

/* ===== 响应式：平板 / 手机 ===== */
@media(max-width:768px){
.nav-links{display:none}
.nav-hamburger{display:flex}
.nav-logo{font-size:1rem}
.hero{padding-top:84px}
.hero-name{font-size:2rem}
.hero-desc{font-size:.88rem}
.section-title{font-size:1.3rem}
.highlight-grid{grid-template-columns:repeat(2,1fr)}
.highlight-num{font-size:1.8rem}
.project-grid{grid-template-columns:1fr}
.skill-grid{grid-template-columns:repeat(2,1fr)}
@media(max-width:480px){.skill-grid{grid-template-columns:1fr}}
.edu-row{flex-direction:column}
.edu-card{flex:1 1 100%}
.tab-btn{min-width:100px;font-size:.82rem;padding:8px 12px}
.hero-contact{gap:6px}
.contact-btn{padding:7px 14px;font-size:.8rem}
.back-top{bottom:16px;right:16px;width:40px;height:40px}
.card-wrapper{animation:photoSway 3.6s ease-in-out infinite}
}
@media(max-width:480px){
.highlight-grid{grid-template-columns:1fr}
.glass-card{width:250px;height:330px}
.hero-name{font-size:1.7rem}
.nav-controls{gap:4px}
.nav-btn{min-width:32px;height:32px;font-size:.9rem}
}
@media(prefers-reduced-motion:reduce){
*{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
[data-reveal]{opacity:1 !important;transform:none !important}
.card-wrapper{transition:none !important}
}

// 底部轻提示：显示后 2.2 秒自动消失
function showToast(msg, ico){
const t = document.getElementById("toast");
t.innerHTML = (ico||"✅") + " " + msg;
t.classList.add("show");
clearTimeout(t._timer);
t._timer = setTimeout(()=>t.classList.remove("show"), 2200);
}

// 复制文本到剪贴板：优先 Clipboard API，失败降级 execCommand 兜底
function copyText(text, label){
navigator.clipboard.writeText(text).then(()=>{
showToast((lang==="zh"?"已复制":"Copied")+": "+label);
}).catch(()=>{
const ta = document.createElement("textarea");
ta.value = text;
document.body.appendChild(ta);
ta.select();
try{ document.execCommand("copy"); showToast((lang==="zh"?"已复制":"Copied")+": "+label); }catch(e){}
document.body.removeChild(ta);
});
}

// 切换标签页：更新高亮与 aria 状态，并重新触发入场动画
function switchTab(btn){
const wrap = btn.closest(".tab-wrap");
const tabs = wrap.querySelectorAll(".tab-btn");
const panels = wrap.querySelectorAll(".tab-panel");
tabs.forEach(t=>{
t.classList.remove("active");
t.setAttribute("aria-selected","false");
t.setAttribute("tabindex","-1");
});
panels.forEach(p=>p.classList.remove("active"));
btn.classList.add("active");
btn.setAttribute("aria-selected","true");
btn.setAttribute("tabindex","0");
const panel = document.getElementById(btn.getAttribute("aria-controls"));
if(panel){
panel.classList.add("active");
setTimeout(()=>{
panel.querySelectorAll("[data-reveal]").forEach(el=>{
el.classList.remove("in-view");
if(observer) observer.observe(el);
});
},50);
}
}

// 标签页键盘操作：左右方向键 / Home / End
function initTabKeyboard(){
document.querySelectorAll(".tab-list").forEach(list=>{
const tabs = list.querySelectorAll(".tab-btn");
tabs.forEach((tab,i)=>{
tab.addEventListener("keydown",e=>{
let idx = i;
if(e.key==="ArrowRight"){ idx=(i+1)%tabs.length; e.preventDefault(); }
else if(e.key==="ArrowLeft"){ idx=(i-1+tabs.length)%tabs.length; e.preventDefault(); }
else if(e.key==="Home"){ idx=0; e.preventDefault(); }
else if(e.key==="End"){ idx=tabs.length-1; e.preventDefault(); }
else return;
tabs[idx].focus();
tabs[idx].click();
});
});
});
}

// 3D 名片视差：鼠标移动驱动卡片旋转（移动端 / 减动效环境禁用）
function init3DCard(){
const hero = document.getElementById("hero");
const wrapper = document.getElementById("cardWrapper");
const card = document.getElementById("glassCard");
if(!hero || !wrapper || !card) return;
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if(reduceMotion) return;
const isMobile = window.matchMedia && window.matchMedia("(max-width:768px)").matches;
if(isMobile) return;
let rafId = null;
wrapper.addEventListener("mousemove", (e)=>{
if(rafId) return;
rafId = requestAnimationFrame(()=>{
rafId = null;
const rect = card.getBoundingClientRect();
const cx = rect.left + rect.width/2;
const cy = rect.top + rect.height/2;
let dx = (e.clientX - cx)/(rect.width/2);
let dy = (e.clientY - cy)/(rect.height/2);
dx = Math.max(-1.4, Math.min(1.4, dx));
dy = Math.max(-1.4, Math.min(1.4, dy));
const rotateY = dx * 18;
const rotateX = -dy * 18;
wrapper.style.transform = "rotateX("+rotateX+"deg) rotateY("+rotateY+"deg)";
const localX = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
const localY = Math.max(0, Math.min(rect.height, e.clientY - rect.top));
card.style.setProperty("--mx", localX+"px");
card.style.setProperty("--my", localY+"px");
const holoAngle = 135 + rotateY * 4 + rotateX * 2;
wrapper.style.setProperty("--holo-angle", holoAngle + "deg");
const shadowX = -rotateY * 1.6;
const shadowY = 20 + Math.abs(rotateX)*1;
card.style.boxShadow = shadowX+"px "+shadowY+"px 55px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.2)";
});
});
wrapper.addEventListener("mouseleave", ()=>{
wrapper.style.transform = "rotateX(0deg) rotateY(0deg)";
card.style.boxShadow = "0 20px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.2)";
wrapper.style.setProperty("--holo-angle", "135deg");
});
}

let observer;
// 滚动入场动画：元素进入视口时触发 reveal 与数字滚动
function initRevealObserver(){
if(observer) observer.disconnect();
observer = new IntersectionObserver((entries)=>{
entries.forEach(entry=>{
if(entry.isIntersecting){
entry.target.classList.add("in-view");
const numEl = entry.target.querySelector("[data-count]");
if(numEl && !numEl._counted){
numEl._counted = true;
countUp(numEl);
}
observer.unobserve(entry.target);
}
});
},{threshold:0.1, rootMargin:"0px 0px -40px 0px"});
document.querySelectorAll("[data-reveal]").forEach(el=>observer.observe(el));
}

// 数字滚动动画：easeOutCubic 缓动从 0 滚到目标值
function countUp(el){
const target = parseInt(el.dataset.count);
const duration = 1200;
const startTime = performance.now();
const suffixSpan = el.querySelector(".highlight-suffix");
function update(now){
const elapsed = now - startTime;
const progress = Math.min(elapsed/duration, 1);
const eased = 1 - Math.pow(1-progress, 3);
const value = Math.floor(target*eased);
if(suffixSpan && el.firstChild){
el.firstChild.nodeValue = value;
} else if(!suffixSpan){
el.textContent = value;
}
if(progress < 1){
requestAnimationFrame(update);
} else {
if(suffixSpan && el.firstChild){
el.firstChild.nodeValue = target;
} else if(!suffixSpan){
el.textContent = target;
}
}
}
requestAnimationFrame(update);
}

// 滚动监听：进度条 + 返回顶部按钮 + 导航高亮（rAF 节流）
function initScroll(){
const progress = document.getElementById("scrollProgress");
const backTop = document.getElementById("backTop");
const sections = ["highlights","experience","projects","skills","education"];
let ticking = false;
window.addEventListener("scroll", ()=>{
if(ticking) return;
ticking = true;
requestAnimationFrame(()=>{
ticking = false;
const scrollY = window.scrollY;
const docH = document.body.scrollHeight - window.innerHeight;
progress.style.width = (docH>0 ? (scrollY/docH)*100 : 0) + "%";
if(scrollY > 400){ backTop.classList.add("show"); }
else { backTop.classList.remove("show"); }
let active = "";
for(const id of sections){
const el = document.getElementById(id);
if(el && el.offsetTop - 120 <= scrollY) active = id;
}
document.querySelectorAll(".nav-link").forEach(link=>{
link.classList.toggle("active", link.getAttribute("href") === "#"+active);
});
});
},{passive:true});
}

// 进站撒彩带（尊重系统「减少动效」设置）
function launchConfetti(){
if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
const colors = ["#6366f1","#ec4899","#8b5cf6","#f59e0b","#10b981"];
for(let i=0;i<28;i++){
const c = document.createElement("div");
c.className = "confetti";
c.style.left = Math.random()*100+"%";
c.style.background = colors[Math.floor(Math.random()*colors.length)];
c.style.animationDelay = Math.random()*1.5+"s";
c.style.animationDuration = (Math.random()*1.5+2.5)+"s";
document.body.appendChild(c);
setTimeout(()=>c.remove(), 5500);
}
}

// 点击按钮时迸发粒子特效
function clickSparkle(e){
if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
const emojis = ["✨","🎉","⭐","💫","🌟","🎊","💖","🎀"];
const colors = ["#6366f1","#ec4899","#8b5cf6","#f59e0b","#10b981","#f472b6","#a5b4fc"];
const x = e.clientX || e.pageX;
const y = e.clientY || e.pageY;
for(let i=0;i<14;i++){
const p = document.createElement("div");
const useEmoji = Math.random() > 0.5;
p.textContent = useEmoji ? emojis[Math.floor(Math.random()*emojis.length)] : "";
if(!useEmoji){
p.style.width = (Math.random()*6+4)+"px";
p.style.height = p.style.width;
p.style.borderRadius = "50%";
p.style.background = colors[Math.floor(Math.random()*colors.length)];
} else {
p.style.fontSize = (Math.random()*10+12)+"px";
}
p.style.position = "fixed";
p.style.left = x+"px";
p.style.top = y+"px";
p.style.pointerEvents = "none";
p.style.zIndex = "9999";
p.style.transition = "all "+(Math.random()*600+400)+"ms cubic-bezier(.25,.46,.45,.94)";
p.style.opacity = "1";
document.body.appendChild(p);
requestAnimationFrame(()=>{
const angle = Math.random()*Math.PI*2;
const dist = Math.random()*100+60;
p.style.left = (x + Math.cos(angle)*dist)+"px";
p.style.top = (y + Math.sin(angle)*dist - Math.random()*40)+"px";
p.style.opacity = "0";
p.style.transform = "scale("+Math.random()*0.5+") rotate("+(Math.random()*360-180)+"deg)";
});
setTimeout(()=>p.remove(), 1200);
}
}

// 在 Hero 背景生成随机闪烁星点
function createSparkles(){
const bg = document.querySelector(".hero-bg");
if(!bg) return;
for(let i=0;i<10;i++){
const s = document.createElement("div");
s.className = "sparkle";
s.style.left = Math.random()*100+"%";
s.style.top = Math.random()*100+"%";
s.style.animationDelay = Math.random()*3+"s";
s.style.animationDuration = (Math.random()*2+2)+"s";
bg.appendChild(s);
}
}

(function init(){
try{
const savedTheme = localStorage.getItem("theme");
document.getElementById("themeBtn").textContent = savedTheme === "light" ? "🌙" : "☀️";
const savedLang = localStorage.getItem("lang");
if(savedLang){
lang = savedLang;
document.getElementById("langBtn").textContent = lang==="zh"?"EN":"中";
document.documentElement.lang = lang==="zh"?"zh-CN":"en";
}
}catch(e){}
renderAll();
initScroll();
init3DCard();
createSparkles();
setTimeout(launchConfetti, 300);
})();
