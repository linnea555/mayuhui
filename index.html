<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>马钰惠 · 个人简历</title>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --primary: #5B6BF0;
            --primary-dark: #4A56D4;
            --primary-light: #7C8AF5;
            --secondary: #F5A623;
            --secondary-light: #FFD966;
            --bg: #F8F9FC;
            --bg-card: #FFFFFF;
            --bg-nav: rgba(255, 255, 255, 0.82);
            --text: #1A1A2E;
            --text-secondary: #4A5568;
            --text-muted: #8892A0;
            --border: #E2E8F0;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 16px 48px rgba(91, 107, 240, 0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            --max-width: 1120px;
            --nav-height: 68px;
        }
        .dark {
            --bg: #12101E;
            --bg-card: #1C1A2E;
            --bg-nav: rgba(18, 16, 30, 0.88);
            --text: #EDEDF5;
            --text-secondary: #B0B8C8;
            --text-muted: #6A7288;
            --border: #2D2A44;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
            --shadow-hover: 0 16px 48px rgba(91, 107, 240, 0.20);
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            transition: background var(--transition), color var(--transition);
            padding-top: var(--nav-height);
            -webkit-font-smoothing: antialiased;
        }
        a {
            color: var(--primary);
            text-decoration: none;
            transition: color var(--transition);
        }
        a:hover {
            color: var(--primary-dark);
        }
        img,
        svg {
            display: block;
            max-width: 100%;
        }
        ::selection {
            background: var(--primary);
            color: #fff;
        }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        /* ===== 容器 ===== */
        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ===== 导航栏 ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: var(--nav-height);
            background: var(--bg-nav);
            backdrop-filter: blur(16px) saturate(1.4);
            -webkit-backdrop-filter: blur(16px) saturate(1.4);
            border-bottom: 1px solid var(--border);
            transition: background var(--transition), border-color var(--transition);
            display: flex;
            align-items: center;
        }
        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            white-space: nowrap;
        }
        .navbar-links {
            display: flex;
            align-items: center;
            gap: 6px;
            list-style: none;
            flex-wrap: wrap;
        }
        .navbar-links a {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 8px;
            transition: background var(--transition), color var(--transition);
            position: relative;
        }
        .navbar-links a:hover {
            background: var(--border);
            color: var(--text);
        }
        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .navbar-actions button {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.1rem;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: background var(--transition), color var(--transition), transform 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .navbar-actions button:hover {
            background: var(--border);
            color: var(--text);
        }
        .navbar-actions button:active {
            transform: scale(0.92);
        }
        .navbar-actions .print-btn {
            font-size: 1rem;
        }
        .navbar-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.4rem;
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 8px;
        }
        .navbar-toggle:hover {
            background: var(--border);
        }

        /* ===== Hero ===== */
        .hero {
            padding: 48px 0 40px;
            position: relative;
            overflow: hidden;
        }
        .hero::after {
            content: '';
            position: absolute;
            top: -40%;
            right: -20%;
            width: 70%;
            height: 100%;
            background: radial-gradient(ellipse at 70% 30%, rgba(91, 107, 240, 0.07), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        .hero .container {
            position: relative;
            z-index: 1;
        }
        .hero-grid {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 40px;
            align-items: center;
        }
        .hero-content {
            max-width: 720px;
        }
        .hero-name {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.1;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
        }
        .hero-title {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }
        .hero-summary {
            font-size: 1rem;
            color: var(--text-secondary);
            max-width: 560px;
            margin-bottom: 20px;
            line-height: 1.7;
        }
        .hero-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 22px;
        }
        .hero-tags .tag {
            background: var(--border);
            color: var(--text-secondary);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            transition: background var(--transition), color var(--transition);
        }
        .hero-tags .tag:hover {
            background: var(--primary);
            color: #fff;
        }
        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: all var(--transition);
            background: var(--border);
            color: var(--text);
            text-decoration: none;
            line-height: 1.2;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            box-shadow: 0 4px 16px rgba(91, 107, 240, 0.28);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(91, 107, 240, 0.35);
            color: #fff;
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--border);
            color: var(--text-secondary);
        }
        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(91, 107, 240, 0.04);
        }
        .hero-avatar {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 12px 40px rgba(91, 107, 240, 0.18);
            background: var(--bg-card);
            border: 2px solid var(--border);
            transition: border-color var(--transition);
        }
        .hero-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ===== 通用区段 ===== */
        .section {
            padding: 48px 0 40px;
            border-top: 1px solid var(--border);
            transition: border-color var(--transition);
        }
        .section:first-of-type {
            border-top: none;
        }
        .section-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 8px 16px;
        }
        .section-title {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            position: relative;
        }
        .section-title::after {
            content: '';
            display: block;
            width: 40px;
            height: 4px;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            margin-top: 4px;
        }
        .section-sub {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* ===== 亮点成果 ===== */
        .highlights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }
        .highlight-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px 20px;
            text-align: center;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: all var(--transition);
        }
        .highlight-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: var(--primary-light);
        }
        .highlight-value {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }
        .highlight-label {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .highlight-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* ===== 技能矩阵 ===== */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px 32px;
        }
        .skill-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .skill-group-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text);
            display: flex;
            justify-content: space-between;
        }
        .skill-group-name .level-label {
            color: var(--text-muted);
            font-weight: 400;
            font-size: 0.8rem;
        }
        .skill-bar {
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 6px;
            overflow: hidden;
            margin: 4px 0 6px;
        }
        .skill-bar .fill {
            height: 100%;
            border-radius: 6px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.8s ease;
            width: 0;
        }
        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 8px;
            margin-top: 2px;
        }
        .skill-tags .st {
            font-size: 0.75rem;
            color: var(--text-muted);
            background: var(--border);
            padding: 1px 10px;
            border-radius: 12px;
        }

        /* ===== Tabs ===== */
        .tabs {
            width: 100%;
        }
        .tabs-nav {
            display: flex;
            gap: 4px;
            border-bottom: 2px solid var(--border);
            margin-bottom: 24px;
            overflow-x: auto;
            padding-bottom: 0;
            flex-wrap: nowrap;
            -webkit-overflow-scrolling: touch;
        }
        .tabs-nav button {
            background: none;
            border: none;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all var(--transition);
            white-space: nowrap;
            font-family: var(--font);
            border-radius: 0;
            position: relative;
        }
        .tabs-nav button:hover {
            color: var(--text);
        }
        .tabs-nav button[aria-selected="true"] {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        .tabs-nav button:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: -4px;
            border-radius: 4px;
        }
        .tabs-panel {
            display: none;
            animation: fadeUp 0.3s ease;
        }
        .tabs-panel[role="tabpanel"] {
            display: none;
        }
        .tabs-panel[role="tabpanel"][data-active="true"] {
            display: block;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 经历 ===== */
        .exp-item {
            display: flex;
            gap: 24px;
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
        }
        .exp-item:last-child {
            border-bottom: none;
        }
        .exp-icon {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: var(--primary);
        }
        .exp-body {
            flex: 1;
        }
        .exp-title {
            font-weight: 700;
            font-size: 1.05rem;
        }
        .exp-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .exp-desc {
            font-size: 0.92rem;
            color: var(--text-secondary);
            margin-top: 6px;
            line-height: 1.7;
        }
        .exp-desc ul {
            list-style: none;
            padding: 0;
            margin: 4px 0 0;
        }
        .exp-desc li {
            padding: 2px 0 2px 20px;
            position: relative;
        }
        .exp-desc li::before {
            content: '▸';
            position: absolute;
            left: 0;
            color: var(--primary);
            font-weight: 700;
        }
        .exp-courses {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .exp-courses .course-tag {
            background: var(--border);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            transition: background var(--transition);
        }
        .exp-courses .course-tag:hover {
            background: var(--primary);
            color: #fff;
        }

        /* ===== 项目卡片 ===== */
        .project-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 28px 28px 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: all var(--transition);
        }
        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: var(--primary-light);
        }
        .project-header {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px 16px;
            margin-bottom: 10px;
        }
        .project-name {
            font-size: 1.15rem;
            font-weight: 700;
        }
        .project-role {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        .project-date {
            font-size: 0.8rem;
            color: var(--text-muted);
            background: var(--border);
            padding: 2px 12px;
            border-radius: 20px;
            white-space: nowrap;
        }
        .project-techs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 8px 0 12px;
        }
        .project-techs .tech {
            background: var(--border);
            padding: 2px 12px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .project-details {
            list-style: none;
            padding: 0;
            margin: 6px 0 14px;
        }
        .project-details li {
            padding: 3px 0 3px 20px;
            position: relative;
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        .project-details li::before {
            content: '✦';
            position: absolute;
            left: 0;
            color: var(--secondary);
            font-size: 0.7rem;
            top: 5px;
        }
        .project-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 16px 24px;
            margin: 10px 0 14px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }
        .project-stats .stat {
            display: flex;
            align-items: baseline;
            gap: 4px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .project-stats .stat strong {
            font-weight: 700;
            color: var(--text);
        }
        .project-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--primary);
            transition: color var(--transition);
        }
        .project-link:hover {
            color: var(--primary-dark);
        }
        .project-link svg {
            width: 16px;
            height: 16px;
        }

        /* ===== 证书 ===== */
        .cert-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
        }
        .cert-item {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 18px 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: all var(--transition);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .cert-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }
        .cert-info {
            flex: 1;
        }
        .cert-name {
            font-weight: 700;
            font-size: 0.95rem;
        }
        .cert-meta {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .cert-id {
            font-size: 0.75rem;
            color: var(--text-muted);
            background: var(--border);
            padding: 2px 10px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 6px;
        }
        .cert-image {
            border-radius: var(--radius-sm);
            overflow: hidden;
            background: var(--bg);
            border: 1px solid var(--border);
        }
        .cert-image img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            max-height: 200px;
        }

        /* ===== 页脚 ===== */
        .footer {
            padding: 32px 0 28px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .footer span {
            margin: 0 6px;
        }

        /* ===== 返回顶部 ===== */
        .back-top {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateY(16px) scale(0.9);
            pointer-events: none;
            z-index: 500;
        }
        .back-top.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }
        .back-top:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(91, 107, 240, 0.25);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 820px) {
            .hero-grid {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 24px;
            }
            .hero-content {
                max-width: 100%;
            }
            .hero-summary {
                max-width: 100%;
                margin-left: auto;
                margin-right: auto;
            }
            .hero-tags {
                justify-content: center;
            }
            .hero-actions {
                justify-content: center;
            }
            .hero-avatar {
                width: 120px;
                height: 120px;
                margin: 0 auto;
            }
            .hero-name {
                font-size: 2.4rem;
            }
            .navbar-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: var(--nav-height);
                left: 0;
                right: 0;
                background: var(--bg-nav);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                padding: 16px 24px;
                gap: 4px;
                border-bottom: 1px solid var(--border);
            }
            .navbar-links.open {
                display: flex;
            }
            .navbar-links a {
                padding: 10px 12px;
                width: 100%;
                text-align: center;
            }
            .navbar-toggle {
                display: block;
            }
            .navbar-actions .print-btn span {
                display: none;
            }
            .highlights-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .skills-grid {
                grid-template-columns: 1fr;
            }
            .exp-item {
                flex-direction: column;
                gap: 10px;
            }
            .project-header {
                flex-direction: column;
                align-items: stretch;
            }
            .project-date {
                align-self: flex-start;
            }

                    btn.setAttribute('tabindex', isActive ? '0' : '-1');
                    const panelId = btn.getAttribute('aria-controls');
                    const panel = document.getElementById(panelId);
                    if (panel) {
                        panel.setAttribute('data-active', isActive ? 'true' : 'false');
                    }
                });
                if (buttons[index]) buttons[index].focus();
            }

            buttons.forEach((btn, index) => {
                btn.addEventListener('click', () => activateTab(index));
                btn.addEventListener('keydown', (e) => {
                    const count = buttons.length;
                    let newIndex = index;
                    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                        e.preventDefault();
                        newIndex = (index + 1) % count;
                    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                        e.preventDefault();
                        newIndex = (index - 1 + count) % count;
                    } else if (e.key === 'Home') {
                        e.preventDefault();
                        newIndex = 0;
                    } else if (e.key === 'End') {
                        e.preventDefault();
                        newIndex = count - 1;
                    }
                    if (newIndex !== index) {
                        activateTab(newIndex);
                    }
                });
            });

            activateTab(0);
        }

        // ================================================================
        //  主题切换
        // ================================================================
        function initTheme() {
            const toggle = $('#themeToggle');
            const icon = $('#themeIcon');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            let dark = localStorage.getItem('theme') === 'dark' || (localStorage.getItem('theme') === null && prefersDark);

            function applyTheme(isDark) {
                document.documentElement.classList.toggle('dark', isDark);
                icon.textContent = isDark ? '☀️' : '🌙';
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                dark = isDark;
            }

            applyTheme(dark);

            toggle.addEventListener('click', () => applyTheme(!dark));
        }

        // ================================================================
        //  打印
        // ================================================================
        function initPrint() {
            $('#printBtn').addEventListener('click', () => window.print());
        }

        // ================================================================
        //  返回顶部
        // ================================================================
        function initBackTop() {
            const btn = $('#backTop');
            let ticking = false;

            window.addEventListener('scroll', () => {
                if (!ticking) {
                    window.requestAnimationFrame(() => {
                        const visible = window.scrollY > 400;
                        btn.classList.toggle('visible', visible);
                        ticking = false;
                    });
                    ticking = true;
                }
            });

            btn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        // ================================================================
        //  邮箱防爬虫 (拼接)
        // ================================================================
        function initContact() {
            const btn = $('#contactBtn');
            btn.addEventListener('click', () => {
                const user = '3867491073';
                const domain = 'qq.com';
                const email = user + '@' + domain;
                navigator.clipboard?.writeText(email).then(() => {
                    const orig = btn.textContent;
                    btn.textContent = '✅ 已复制邮箱';
                    setTimeout(() => { btn.textContent = orig; }, 2000);
                }).catch(() => {
                    alert('📧 ' + email);
                });
                console.log('📧 邮箱:', email);
            });
        }

        // ================================================================
        //  移动端导航切换
        // ================================================================
        function initNavToggle() {
            const toggle = $('#navToggle');
            const links = $('#navLinks');
            toggle.addEventListener('click', () => {
                const open = links.classList.toggle('open');
                toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
                toggle.textContent = open ? '✕' : '☰';
            });
            links.querySelectorAll('a').forEach(a => {
                a.addEventListener('click', () => {
                    links.classList.remove('open');
                    toggle.setAttribute('aria-expanded', 'false');
                    toggle.textContent = '☰';
                });
            });
        }

        // ================================================================
        //  页脚更新时间
        // ================================================================
        function updateFooter() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            $('#footerText').textContent = `© ${y} 马钰惠 · 简历持续更新中 · 最后更新 ${y}-${m}-${d}`;
        }

        // ================================================================
        //  启动
        // ================================================================
        document.addEventListener('DOMContentLoaded', () => {
            renderHero();
            renderHighlights();
            renderSkills();
            renderExperience();
            renderProjects();
            renderCertificates();
            initTheme();
            initPrint();
            initBackTop();
            initContact();
            initNavToggle();
            updateFooter();

            document.querySelectorAll('a[href^="#"]').forEach(a => {
                a.addEventListener('click', (e) => {
                    const target = document.querySelector(a.getAttribute('href'));
                    if (target) {
                        e.preventDefault();
                        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                });
            });
        });

        window.addEventListener('beforeprint', () => {
            document.querySelectorAll('[role="tabpanel"]').forEach(p => {
                p.setAttribute('data-print-visible', p.getAttribute('data-active'));
                p.setAttribute('data-active', 'true');
            });
        });
        window.addEventListener('afterprint', () => {
            document.querySelectorAll('[role="tabpanel"]').forEach(p => {
                const prev = p.getAttribute('data-print-visible');
                p.setAttribute('data-active', prev === 'true' ? 'true' : 'false');
                p.removeAttribute('data-print-visible');
            });
        });
    </script>
</body>
</html>
