<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>

<title>马钰惠 · 个人作品集</title>
<meta name="description" content="马钰惠个人作品集：资源循环科学与工程本科在读，AI训练师认证，专注AI辅助开发与跨平台游戏开发。" />
<meta name="keywords" content="马钰惠, 个人作品集, AI训练师, 前端开发, 游戏开发" />
<style>
/* 样式完全保留，未作任何修改 */
:root {
  --forest-mist: #FDFBEF; --forest-fog: #ECFDF5; --forest-leaf: #10B981; --forest-deep: #059669;
  --forest-pine: #064E3B; --forest-pine2: #065F46; --forest-sun: #FBBF24; --forest-sunlite: #FCD34D;
  --forest-ink: #1F2937; --forest-inksub: #6B7280; --forest-inkfaint: #9CA3AF;
  --forest-snow: #F9FAFB; --forest-snowsub: #D1D5DB;
  --txt: var(--forest-snow); --txt-sub: var(--forest-snowsub); --txt-faint: var(--forest-inkfaint);
  --card-bg: rgba(6,78,59,0.7); --card-bd: rgba(16,185,129,0.3);
}
[data-theme="light"] {
  --txt: var(--forest-ink); --txt-sub: var(--forest-inksub); --txt-faint: var(--forest-inkfaint);
  --card-bg: rgba(255,255,255,0.7); --card-bd: rgba(16,185,129,0.2);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--txt); min-height: 100vh; transition: color 0.5s;
  -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }
a { text-decoration: none; color: inherit; }
img { display: block; }
svg { fill: currentColor; }

.forest-bg { position: fixed; inset: 0; z-index: -10; overflow: hidden; pointer-events: none; }
.forest-base {
  position: absolute; inset: 0; transform: scale(1.1); background-size: cover; background-position: center;
  filter: blur(10px); transition: opacity 0.7s; animation: forest-pan 26s ease-in-out infinite;
}
.forest-tint { position: absolute; inset: 0; background: rgba(6,78,59,0.7); transition: background 0.7s; }
[data-theme="light"] .forest-tint { background: rgba(254,252,232,0.6); }
.forest-rays {
  position: absolute; inset: 0; background-size: cover; background-position: center;
  opacity: 0.4; filter: blur(3px); mix-blend-mode: soft-light; animation: leaf-drift 20s ease-in-out infinite;
}
.tree-left, .tree-right { position: absolute; top: 0; height: 100%; width: 46%; background-size: cover; background-position: center; filter: blur(6px); opacity: 0.45; }
.tree-left { left: -12%; animation: sway-left 9s ease-in-out infinite;
  -webkit-mask-image: linear-gradient(to right, black 30%, transparent 95%); mask-image: linear-gradient(to right, black 30%, transparent 95%); }
.tree-right { right: -12%; animation: sway-right 11s ease-in-out infinite;
  -webkit-mask-image: linear-gradient(to left, black 30%, transparent 95%); mask-image: linear-gradient(to left, black 30%, transparent 95%); }
.glow-a, .glow-b { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.5; animation: leaf-drift 20s ease-in-out infinite; }
.glow-a { top: 8%; left: 8%; width: 420px; height: 420px; background: radial-gradient(circle, rgba(251,191,36,0.35) 0%, transparent 70%); }
.glow-b { top: 58%; right: 6%; width: 320px; height: 320px; background: radial-gradient(circle, rgba(16,185,129,0.28) 0%, transparent 70%); animation-delay: -6s; }
.dust { position: absolute; border-radius: 50%; animation: dust-rise linear infinite; }

.sunlight {
  position: fixed; top: 0; left: 0; z-index: 0; width: 520px; height: 520px; border-radius: 50%;
  pointer-events: none; mix-blend-mode: soft-light; transform: translate(-600px, -600px);
  background: radial-gradient(circle, rgba(255,247,214,0.95) 0%, rgba(252,211,77,0.45) 32%, rgba(251,191,36,0.18) 55%, transparent 72%);
}

.navbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 40; height: 64px;
  display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
  border-bottom: 1px solid var(--card-bd); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  background: rgba(6,78,59,0.8); transition: background 0.3s, border-color 0.3s;
}
[data-theme="light"] .navbar { background: rgba(255,255,255,0.75); }
.nav-brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1.125rem; color: var(--forest-fog); }
[data-theme="light"] .nav-brand { color: var(--forest-deep); }
.nav-brand .logo { width: 32px; height: 32px; border-radius: 8px; background: var(--forest-leaf); color: #fff; display: flex; align-items: center; justify-content: center; }
.nav-links { display: none; align-items: center; gap: 28px; }
.nav-links a { position: relative; font-size: 0.875rem; font-weight: 500; color: var(--txt-sub); transition: color 0.2s; }
.nav-links a:hover { color: var(--forest-leaf); }
.nav-links a::after { content: ""; position: absolute; bottom: -4px; left: 0; height: 2px; width: 0; background: var(--forest-leaf); transition: width 0.3s; }
.nav-links a:hover::after { width: 100%; }
.nav-actions { display: flex; align-items: center; gap: 10px; }
.nav-actions .lang-btn { height: 36px; padding: 0 12px; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; transition: all 0.2s; background: var(--forest-pine2); color: var(--forest-snowsub); }
.nav-actions .lang-btn:hover { background: var(--forest-leaf); color: #fff; transform: scale(1.1); }
.nav-actions .icon-btn { width: 36px; height: 36px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; background: var(--forest-pine2); color: var(--forest-snow); }
.nav-actions .icon-btn:hover { background: var(--forest-leaf); color: #fff; transform: scale(1.1); }
[data-theme="light"] .nav-actions .lang-btn { background: var(--forest-fog); color: var(--forest-ink); }
[data-theme="light"] .nav-actions .icon-btn { background: var(--forest-fog); color: var(--forest-ink); }
.nav-actions .print-btn { display: none; }
.nav-actions .menu-btn { display: flex; }

main { position: relative; z-index: 10; max-width: 1152px; margin: 0 auto; padding: 0 16px 48px; }

.hero { text-align: center; padding: 112px 16px 32px; }
.badge-wrap { display: flex; justify-content: center; margin-bottom: 40px; }
.hero-badge {
  display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 9999px;
  border: 1px solid var(--card-bd); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  font-size: 0.875rem; margin-bottom: 24px; background: rgba(6,78,59,0.7); color: var(--forest-sunlite);
}
[data-theme="light"] .hero-badge { background: rgba(255,255,255,0.7); color: var(--forest-deep); }
.hero h1 {
  font-size: 3rem; font-weight: 800; margin-bottom: 16px;
  background: linear-gradient(135deg, var(--forest-deep), var(--forest-leaf), var(--forest-sun));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero-sub { font-size: 1.25rem; max-width: 672px; margin: 0 auto 32px; line-height: 1.625; color: var(--txt-sub); }
.hero-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; margin-bottom: 32px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: 8px; font-size: 0.875rem; font-weight: 600; transition: all 0.2s; }
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--forest-leaf); color: #fff; box-shadow: 0 4px 14px rgba(16,185,129,0.4); }
.btn-primary:hover { background: var(--forest-deep); box-shadow: 0 6px 20px rgba(16,185,129,0.5); }
.btn-secondary { border: 1px solid var(--card-bd); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); background: rgba(6,78,59,0.7); color: var(--forest-snow); }
.btn-secondary:hover { background: var(--forest-pine2); }
[data-theme="light"] .btn-secondary { background: rgba(255,255,255,0.7); color: var(--forest-ink); }
[data-theme="light"] .btn-secondary:hover { background: var(--forest-fog); }
.skill-badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.skill-badges span {
  padding: 6px 14px; border-radius: 9999px; border: 1px solid var(--card-bd); font-size: 0.75rem; font-weight: 500;
  transition: all 0.2s; cursor: default; background: rgba(6,78,59,0.7); color: var(--forest-snowsub); backdrop-filter: blur(12px);
}
.skill-badges span:hover { transform: translateY(-2px); background: var(--forest-leaf); color: #fff; border-color: var(--forest-leaf); }
[data-theme="light"] .skill-badges span { background: rgba(255,255,255,0.7); color: var(--forest-inksub); }

.section { margin-bottom: 64px; opacity: 0; transform: translateY(32px); transition: all 0.7s ease-out; }
.section.visible { opacity: 1; transform: translateY(0); }
.section-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
.section-icon { width: 36px; height: 36px; border-radius: 8px; background: var(--forest-leaf); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1rem; box-shadow: 0 4px 14px rgba(16,185,129,0.4); }
.section-title { font-size: 1.5rem; font-weight: 700; color: var(--txt); }

.card { border-radius: 16px; border: 1px solid var(--card-bd); background: var(--card-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }

.highlights-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
.highlight-card { padding: 24px; text-align: center; transition: all 0.3s; }
.highlight-card:hover { transform: translateY(-4px); border-color: var(--forest-leaf); box-shadow: 0 12px 40px rgba(6,78,59,0.25); }
.highlight-number { font-size: 1.875rem; font-weight: 800; color: var(--forest-leaf); margin-bottom: 4px; }
.highlight-label { font-size: 0.875rem; font-weight: 500; color: var(--txt-sub); }
.highlight-desc { font-size: 0.75rem; margin-top: 4px; color: var(--txt-faint); }

.tabs { overflow: hidden; }
.tabs-header { display: flex; border-bottom: 1px solid var(--card-bd); }
.tab-btn { flex: 1; padding: 16px 0; font-size: 0.875rem; font-weight: 600; position: relative; transition: color 0.2s, background 0.2s; color: var(--txt-sub); }
.tab-btn:hover { color: var(--forest-leaf); background: rgba(6,95,70,0.6); }
[data-theme="light"] .tab-btn:hover { background: rgba(236,253,245,0.7); }
.tab-btn.active { color: var(--forest-leaf); }
.tab-btn.active::after { content: ""; position: absolute; bottom: 0; left: 20%; right: 20%; height: 3px; border-radius: 3px 3px 0 0; background: var(--forest-leaf); }
.tabs-content { padding: 24px; }
.tab-panel { animation: fadein 0.35s ease; }

.timeline { position: relative; padding-left: 24px; }
.timeline::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 2px; background: rgba(16,185,129,0.3); }
.timeline-item { position: relative; }
.timeline-item + .timeline-item { margin-top: 28px; }
.timeline-dot { position: absolute; left: -29px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--forest-leaf); border: 3px solid #064E3B; box-shadow: 0 0 0 3px rgba(52,211,153,0.5); }
[data-theme="light"] .timeline-dot { border-color: #ffffff; }
.timeline-date { font-size: 0.75rem; font-weight: 600; color: var(--forest-leaf); margin-bottom: 2px; }
.timeline-title { font-size: 1rem; font-weight: 700; color: var(--txt); }
.timeline-company { font-size: 0.875rem; margin-bottom: 6px; color: var(--txt-sub); }
.timeline-desc { font-size: 0.875rem; line-height: 1.625; color: var(--txt-sub); }

.projects-grid { display: grid; grid-template-columns: 1fr; gap: 24px; }
.project-card { overflow: hidden; transition: all 0.3s; }
.project-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(6,78,59,0.28); }
.project-image { height: 128px; background: linear-gradient(135deg, var(--forest-fog), var(--forest-leaf)); display: flex; align-items: center; justify-content: center; font-size: 3rem; }
.project-content { padding: 20px; }
.project-title { font-size: 1.125rem; font-weight: 700; margin-bottom: 8px; color: var(--txt); }
.project-tech { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.tech-tag { padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: 500; background: var(--forest-pine2); color: var(--forest-sunlite); }
[data-theme="light"] .tech-tag { background: var(--forest-fog); color: var(--forest-deep); }
.project-desc { font-size: 0.875rem; line-height: 1.625; margin-bottom: 16px; color: var(--txt-sub); }
.project-link { display: inline-flex; align-items: center; gap: 6px; font-size: 0.875rem; font-weight: 600; color: var(--forest-leaf); }
.project-link:hover { text-decoration: underline; }
.project-internal { display: inline-flex; align-items: center; gap: 6px; font-size: 0.875rem; color: var(--txt-faint); }

.skills-grid { display: grid; grid-template-columns: 1fr; gap: 24px; }
.skill-category { padding: 20px; }
.skill-category-title { display: flex; align-items: center; gap: 8px; font-size: 0.875rem; font-weight: 700; margin-bottom: 16px; color: var(--forest-sunlite); }
[data-theme="light"] .skill-category-title { color: var(--forest-deep); }
.skill-category-title .cat-icon { color: var(--forest-leaf); display: inline-flex; }
.skill-item { margin-bottom: 12px; }
.skill-item:last-child { margin-bottom: 0; }
.skill-header { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 0.875rem; }
.skill-name { color: var(--txt); }
.skill-level { font-size: 0.75rem; color: var(--txt-faint); }
.skill-bar { height: 6px; border-radius: 9999px; overflow: hidden; background: var(--forest-pine2); }
[data-theme="light"] .skill-bar { background: var(--forest-fog); }
.skill-progress { height: 100%; border-radius: 9999px; background: linear-gradient(to right, var(--forest-leaf), #34D399); transition: width 1s ease-out; width: 0; }

.edu-card { padding: 24px; display: flex; gap: 20px; align-items: flex-start; transition: all 0.3s; margin-bottom: 24px; }
.edu-card:hover { transform: translateX(4px); border-color: var(--forest-leaf); }
.edu-icon { width: 48px; height: 48px; border-radius: 16px; background: var(--forest-leaf); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; flex-shrink: 0; box-shadow: 0 4px 14px rgba(16,185,129,0.4); }
.edu-school { font-size: 1.125rem; font-weight: 700; color: var(--txt); }
.edu-major { font-size: 0.875rem; font-weight: 600; color: var(--forest-leaf); margin-bottom: 2px; }
.edu-time { font-size: 0.75rem; margin-bottom: 8px; color: var(--txt-faint); }
.edu-courses { font-size: 0.875rem; line-height: 1.625; color: var(--txt-sub); }
.cert-item { display: flex; align-items: center; gap: 16px; padding: 16px; border-radius: 16px; transition: all 0.3s; }
.cert-item:hover { transform: translateX(4px); background: var(--forest-pine2); }
[data-theme="light"] .cert-item:hover { background: var(--forest-fog); }
.cert-icon { width: 40px; height: 40px; border-radius: 8px; background: var(--forest-sun); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.125rem; flex-shrink: 0; box-shadow: 0 4px 14px rgba(251,191,36,0.45); }
.cert-title { font-size: 0.875rem; font-weight: 600; color: var(--txt); }
.cert-date { font-size: 0.75rem; color: var(--txt-faint); }
.cert-number { font-size: 11px; font-family: monospace; letter-spacing: 0.05em; margin-top: 2px; opacity: 0.8; color: var(--txt-faint); }

footer { position: relative; z-index: 10; text-align: center; padding: 32px 0; font-size: 0.875rem; border-top: 1px solid var(--card-bd); color: var(--txt-faint); }
footer p + p { margin-top: 8px; font-size: 0.75rem; }

.back-top {
  position: fixed; bottom: 24px; right: 24px; z-index: 40; width: 44px; height: 44px; border-radius: 50%;
  background: var(--forest-leaf); color: #fff; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 14px rgba(16,185,129,0.45); transition: all 0.3s; opacity: 0; pointer-events: none;
}
.back-top.visible { opacity: 1; pointer-events: auto; }
.back-top:hover { background: var(--forest-deep); transform: translateY(-2px); }

.toast {
  position: fixed; bottom: 144px; right: 24px; z-index: 50; padding: 12px 20px; border-radius: 8px;
  font-size: 0.875rem; color: #fff; transition: all 0.3s; opacity: 0; transform: translateY(20px); pointer-events: none;
  background: var(--forest-snow); color: var(--forest-pine);
}
[data-theme="light"] .toast { background: var(--forest-ink); color: #fff; }
.toast.show { opacity: 1; transform: translateY(0); }

.badge-scene { position: relative; width: 280px; perspective: 1100px; user-select: none; }
.badge-3d { transform-style: preserve-3d; }
.badge-card { position: relative; transform-style: preserve-3d; transition: transform 0.12s linear; will-change: transform; }
.clip-wrap { display: flex; justify-content: center; position: relative; z-index: 20; pointer-events: none; }
.clip-body {
  position: relative; width: 56px; height: 76px; margin-bottom: -28px; border-radius: 16px 16px 8px 8px;
  background: linear-gradient(100deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.1) 30%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.14) 72%, rgba(255,255,255,0.42) 100%);
  border: 2px solid rgba(255,255,255,0.45);
  box-shadow: inset 2px 0 4px rgba(255,255,255,0.4), inset -2px 0 4px rgba(255,255,255,0.3), inset 0 2px 2px rgba(255,255,255,0.8), 0 2px 8px rgba(0,0,0,0.35);
}
.clip-hole { width: 24px; height: 24px; margin: 12px auto 0; border-radius: 50%; background: rgba(6,14,10,0.7);
  box-shadow: inset 0 3px 5px rgba(0,0,0,0.9), inset 0 -1px 1px rgba(255,255,255,0.2), 0 1px 0 rgba(255,255,255,0.5); }
.clip-tongue {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: 0; width: 32px; height: 36px; border-radius: 0 0 8px 8px;
  background: linear-gradient(to bottom, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.12) 60%, rgba(255,255,255,0.24) 100%);
  border: 1.5px solid rgba(255,255,255,0.4); border-top: none;
  box-shadow: inset 0 -2px 2px rgba(255,255,255,0.4), inset 2px 0 2px rgba(255,255,255,0.25), inset -2px 0 2px rgba(255,255,255,0.25);
}
.sleeve {
  position: relative; border-radius: 28px; padding: 44px 14px 14px;
  background: linear-gradient(150deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.06) 28%, rgba(255,255,255,0.04) 62%, rgba(255,255,255,0.12) 100%);
  border: 2px solid rgba(255,255,255,0.55);
  box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 6px 18px rgba(0,0,0,0.35), inset 0 0 0 5px rgba(255,255,255,0.08), inset 0 0 0 6px rgba(255,255,255,0.22), inset 0 3px 3px rgba(255,255,255,0.65), inset 0 -4px 7px rgba(255,255,255,0.18), inset 5px 0 9px rgba(255,255,255,0.2), inset -5px 0 9px rgba(255,255,255,0.2);
}
.sleeve-light {
  position: absolute; inset: 0; border-radius: 28px; pointer-events: none;
  background: radial-gradient(130% 55% at 50% -12%, rgba(255,255,255,0.28) 0%, transparent 55%), radial-gradient(130% 45% at 50% 112%, rgba(255,255,255,0.12) 0%, transparent 50%), linear-gradient(100deg, rgba(255,255,255,0.14) 0%, transparent 12%, transparent 88%, rgba(255,255,255,0.1) 100%);
}
.sleeve-hole {
  position: absolute; top: 15px; left: 50%; transform: translateX(-50%); width: 40px; height: 15px; border-radius: 9999px; z-index: 10; pointer-events: none;
  background: rgba(4,10,8,0.75);
  box-shadow: inset 0 3px 5px rgba(0,0,0,0.9), inset 0 -1px 1px rgba(255,255,255,0.15), 0 1px 0 rgba(255,255,255,0.4);
}
.photo-frame { position: relative; border-radius: 16px; overflow: hidden; transform: translateZ(20px); }
.photo-area { position: relative; height: 330px; }
.photo-bg { position: absolute; inset: 0; background: linear-gradient(165deg, #16212c 0%, #101820 45%, #0b1016 100%); }
.photo-area img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; filter: contrast(1.12) saturate(1.18) brightness(1.06); }
.holo-mask {
  position: absolute; inset: 0; pointer-events: none;
  -webkit-mask-image: linear-gradient(to right, black 0%, black 22%, transparent 42%), linear-gradient(to bottom, black 0%, black 12%, transparent 30%);
  mask-image: linear-gradient(to right, black 0%, black 22%, transparent 42%), linear-gradient(to bottom, black 0%, black 12%, transparent 30%);
  -webkit-mask-composite: source-over; mask-composite: add;
}
.holo { position: absolute; background-size: 200% 100%; mix-blend-mode: screen; }
.holo-a { top: -14%; left: -16%; width: 42%; height: 42%; transform: rotate(30deg); filter: blur(12px) saturate(1.4); opacity: 0.7; }
.holo-b { top: 34%; left: -22%; width: 34%; height: 34%; transform: rotate(28deg); filter: blur(13px) saturate(1.3); opacity: 0.55; }
.holo-c { bottom: -12%; left: -14%; width: 32%; height: 32%; transform: rotate(26deg); filter: blur(12px) saturate(1.3); opacity: 0.5; }
.photo-sheen {
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(115deg, rgba(255,255,255,0.12) 0%, transparent 16%, transparent 84%, rgba(255,255,255,0.06) 94%, transparent 100%);
}
.badge-shadow { margin: 24px auto 0; height: 16px; width: 160px; border-radius: 100%; background: rgba(0,0,0,0.45); filter: blur(16px); }

  document.getElementById("lang-btn").textContent = lang === "zh" ? "EN" : "中文";
  renderHighlights(); renderTimeline(); renderProjects(); renderSkills(); renderBadges();
}

function renderBadges() {
  document.getElementById("skill-badges").innerHTML = resume.badges.map((b) => `<span>${esc(b)}</span>`).join("");
}
function renderHighlights() {
  document.getElementById("highlights-grid").innerHTML = resume.highlights.map((h) => `
    <div class="card highlight-card">
      <div class="highlight-number">${h.number}</div>
      <div class="highlight-label">${esc(h.label[lang])}</div>
      <div class="highlight-desc">${esc(h.desc[lang])}</div>
    </div>`).join("");
}
function timelineHTML(entries) {
  return entries.map((e) => `
    <div class="timeline-item">
      <span class="timeline-dot"></span>
      <div class="timeline-date">${esc(e.date)}</div>
      <div class="timeline-title">${esc(e.title)}</div>
      <div class="timeline-company">${esc(e.company)}</div>
      <div class="timeline-desc">${esc(e.desc)}</div>
    </div>`).join("");
}
function renderTimeline() {
  document.getElementById("tl-work").innerHTML = timelineHTML([
    { date: "2026.08 - 至今", title: t("work_title"), company: t("work_company"), desc: t("work_desc") },
  ]);
  document.getElementById("tl-campus").innerHTML = timelineHTML([
    { date: "2026.09 - 至今", title: t("campus_title"), company: "山西科技学院 · 资源循环科学与工程", desc: t("campus_desc") },
  ]);
}
function parseTech(s) { try { const a = JSON.parse(s); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
function renderProjects() {
  const card = (p) => `
    <div class="card project-card">
      <div class="project-image">${esc(p.icon)}</div>
      <div class="project-content">
        <h3 class="project-title">${esc(lang === "zh" ? p.title_zh : p.title_en)}</h3>
        <div class="project-tech">${parseTech(p.tech).map((tag) => `<span class="tech-tag">${esc(tag)}</span>`).join("")}</div>
        <p class="project-desc">${esc(lang === "zh" ? p.desc_zh : p.desc_en)}</p>
        ${p.demo && p.link ? `<a href="${p.link}" target="_blank" rel="noopener noreferrer" class="project-link">${FA.globe} ${t("demo")}</a>` : `<span class="project-internal">${p.demo ? FA.globe : FA.lock} ${p.demo ? t("demo") : t("internal")}</span>`}
      </div>
    </div>`;
  const games = resume.projects.filter((p) => p.category === "game");
  const ais = resume.projects.filter((p) => p.category === "ai");
  document.getElementById("pg-game").innerHTML = games.map(card).join("");
  document.getElementById("pg-ai").innerHTML = ais.map(card).join("");
}
function renderSkills() {
  const cats = [
    { key: "ai", icon: FA.robot, key2: "skill_cat_ai" },
    { key: "frontend", icon: FA.laptop, key2: "skill_cat_frontend" },
    { key: "gamedev", icon: FA.gamepad, key2: "skill_cat_gamedev" },
    { key: "tools", icon: FA.tools, key2: "skill_cat_tools" },
  ];
  document.getElementById("skills-grid").innerHTML = cats.map((c) => `
    <div class="card skill-category">
      <div class="skill-category-title"><span class="cat-icon">${c.icon}</span>${t(c.key2)}</div>
      ${resume.skills[c.key].map((s) => `
        <div class="skill-item">
          <div class="skill-header"><span class="skill-name">${esc(s.name)}</span><span class="skill-level">${esc(s.levelText)}</span></div>
          <div class="skill-bar"><div class="skill-progress" data-level="${s.level}"></div></div>
        </div>`).join("")}
    </div>`).join("");
  observeSkills();
}

function observeSkills() {
  const grid = document.getElementById("skills-grid");
  const ob = new IntersectionObserver((es) => es.forEach((e) => {
    if (e.isIntersecting) {
      grid.querySelectorAll(".skill-progress").forEach((el) => { el.style.width = el.dataset.level + "%"; });
      ob.disconnect();
    }
  }), { threshold: 0.15 });
  ob.observe(grid);
}
function observeSections() {
  const ob = new IntersectionObserver((es) => es.forEach((e) => {
    if (e.isIntersecting) { e.target.classList.add("visible"); ob.unobserve(e.target); }
  }), { threshold: 0.12 });
  document.querySelectorAll(".section").forEach((s) => ob.observe(s));
}

let toastTimer = 0;
function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 3000);
}
function copyText(text, msg) {
  const done = () => showToast(msg);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(done);
  } else {
    const input = document.createElement("input");
    input.value = text;
    document.body.appendChild(input);
    input.select();
    document.execCommand("copy");
    document.body.removeChild(input);
    done();
  }
}

function initTabs(rootId) {
  const root = document.getElementById(rootId);
  root.querySelectorAll(".tab-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      root.querySelectorAll(".tab-btn").forEach((b) => { b.classList.remove("active"); b.setAttribute("aria-selected", "false"); });
      btn.classList.add("active");
      btn.setAttribute("aria-selected", "true");
      root.querySelectorAll(".tab-panel").forEach((p) => {
        p.style.display = p.getAttribute("data-panel") === btn.getAttribute("data-tab") ? "" : "none";
      });
    });
  });
}

function setTheme(dark) {
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  document.getElementById("theme-btn").innerHTML = dark ? FA.sun : FA.moon;
  document.getElementById("forest-base").style.backgroundImage = `url(${dark ? IMG.dew : IMG.base})`;
}
let isDark = true;

function initSunlight() {
  const mq = window.matchMedia("(min-width: 768px) and (hover: hover) and (pointer: fine)");
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)");
  const sun = document.getElementById("sunlight");
  let enabled = false;
  let raf = 0;
  const pos = { x: -600, y: -600 };
  const target = { x: -600, y: -600 };
  const onMove = (e) => { target.x = e.clientX; target.y = e.clientY; };
  const loop = () => {
    pos.x += (target.x - pos.x) * 0.08;
    pos.y += (target.y - pos.y) * 0.08;
    sun.style.transform = `translate(${pos.x - 260}px, ${pos.y - 260}px)`;
    raf = requestAnimationFrame(loop);
  };
  const check = () => {
    const on = mq.matches && !reduced.matches;
    if (on === enabled) return;
    enabled = on;
    sun.style.display = on ? "" : "none";
    if (on) { window.addEventListener("mousemove", onMove); raf = requestAnimationFrame(loop); }
    else { window.removeEventListener("mousemove", onMove); cancelAnimationFrame(raf); }
  };
  check();
  mq.addEventListener("change", check);
  reduced.addEventListener("change", check);
}

function initBadge() {
  const wrap = document.getElementById("badge-scene");
  const card = document.getElementById("badge-card");
  const holoA = document.getElementById("holo-a");
  const holoB = document.getElementById("holo-b");
  const holoC = document.getElementById("holo-c");
  const holoGradient = "linear-gradient(115deg, transparent 0%, rgba(168,85,247,0.85) 18%, rgba(96,165,250,0.8) 34%, rgba(255,255,255,0.9) 46%, rgba(74,222,128,0.75) 62%, rgba(248,113,113,0.7) 80%, transparent 100%)";
  [holoA, holoB, holoC].forEach((el) => { el.style.background = holoGradient; });
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)");
  const isTouch = window.matchMedia("(hover: none), (pointer: coarse)").matches;
  if (reduced.matches) return;
  const rot = { x: 0, y: 0 };
  const targetRot = { x: 0, y: 0 };
  const apply = (px, py) => { targetRot.x = -py * 22; targetRot.y = px * 22; };
  const onMove = (e) => {
    const r = wrap.getBoundingClientRect();
    const inside = e.clientX > r.left - 100 && e.clientX < r.right + 100 && e.clientY > r.top - 100 && e.clientY < r.bottom + 100;
    if (!inside) { targetRot.x = 0; targetRot.y = 0; return; }
    apply((e.clientX - r.left) / r.width - 0.5, (e.clientY - r.top) / r.height - 0.5);
  };
  const onTouch = (e) => {
    const touch = e.touches[0];
    if (!touch) return;
    const r = wrap.getBoundingClientRect();
    apply((touch.clientX - r.left) / r.width - 0.5, (touch.clientY - r.top) / r.height - 0.5);
  };
  const onTouchEnd = () => { targetRot.x = 0; targetRot.y = 0; };
  const onOrient = (e) => {
    if (e.gamma == null || e.beta == null) return;
    apply(Math.max(-0.5, Math.min(0.5, e.gamma / 60)), Math.max(-0.5, Math.min(0.5, (e.beta - 40) / 60)));
  };
  window.addEventListener("mousemove", onMove);
  if (isTouch) {
    window.addEventListener("touchmove", onTouch, { passive: true });
    window.addEventListener("touchend", onTouchEnd);
    window.addEventListener("deviceorientation", onOrient);
  }
  const loop = () => {
    rot.x += (targetRot.x - rot.x) * 0.1;
    rot.y += (targetRot.y - rot.y) * 0.1;
    card.style.transform = `rotateX(${rot.x}deg) rotateY(${rot.y}deg)`;
    const shift = (el, f) => { el.style.backgroundPosition = `${50 + rot.y * f}% ${50 + rot.x * f}%`; };
    shift(holoA, 3); shift(holoB, -3); shift(holoC, 2);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}

function initDust() {
  const box = document.getElementById("dust-box");
  let html = "";
  for (let i = 0; i < 18; i++) {
    const left = ((i * 53 + 7) % 100) + "%";
    const top = (30 + ((i * 37) % 65)) + "%";
    const size = 3 + ((i * 7) % 6);
    const delay = ((i * 1.7) % 14) + "s";
    const duration = (11 + ((i * 3) % 10)) + "s";
    const gold = i % 3 === 0;
    html += `<span class="dust" style="left:${left};top:${top};width:${size}px;height:${size}px;animation-delay:${delay};animation-duration:${duration};background:${gold ? "radial-gradient(circle, rgba(252,211,77,0.95) 0%, rgba(252,211,77,0) 70%)" : "radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 70%)"};box-shadow:${gold ? "0 0 8px rgba(251,191,36,0.6)" : "0 0 6px rgba(255,255,255,0.5)"}"></span>`;
  }
  box.innerHTML = html;
}
